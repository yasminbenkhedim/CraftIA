# CraftAI Helm Chart Default Values

api:
  replicas: 2
  image:
    repository: craftai/api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 8000

worker:
  replicas: 3
  image:
    repository: craftai/worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  gpu:
    enabled: true
    count: 1
  terminationGracePeriodSeconds: 120

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  storage: "10Gi"
  storageClassName: standard

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"

ingress:
  enabled: false
  host: craftai.example.com
  annotations: {}

autoscaling:
  enabled: true
  api:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  worker:
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 80

config:
  postgresServer: postgres-service
  postgresPort: "5432"
  postgresDb: createflow_db
  redisUrl: redis://redis-service:6379/0
  storagePath: /app/storage/artifacts
