apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "craftai.fullname" . }}-config
data:
  POSTGRES_SERVER: {{ .Values.config.postgresServer | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  STORAGE_PATH: {{ .Values.config.storagePath | quote }}
