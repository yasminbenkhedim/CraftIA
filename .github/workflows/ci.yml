name: CraftAI Enterprise Production CI/CD

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pytest
      - name: Lint with flake8
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics || true
      - name: Static typing with mypy
        run: mypy backend --ignore-missing-imports || true

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: createflow_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      - name: Run Enterprise Production Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/createflow_db
          REDIS_URL: redis://localhost:6379/0
          GROQ_API_KEY: test_groq_api_key_ci
        run: |
          python -m pytest backend/test_upgrade11_enterprise.py -v --tb=short

  docker-and-k8s-validation:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image (API)
        run: docker build -t craftai/api:latest -f Dockerfile .
      - name: Build Docker Image (Worker)
        run: docker build -t craftai/worker:latest -f Dockerfile.worker .
      - name: Validate Docker Compose
        run: docker-compose config
      - name: Helm Lint
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint helm/craftai

  security-and-cve-scan:
    runs-on: ubuntu-latest
    needs: docker-and-k8s-validation
    steps:
      - uses: actions/checkout@v4
      - name: Run Supply Chain & CVE Scan
        run: |
          python -c "from backend.security.supply_chain import SupplyChainSecurity; print(SupplyChainSecurity.run_cve_scan())"

  release-and-publish:
    runs-on: ubuntu-latest
    needs: security-and-cve-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Create Release Artifacts
        run: |
          echo "CraftAI Enterprise Release 11.0.0 validated and built successfully" > release_notes.txt
