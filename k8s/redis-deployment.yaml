apiVersion: apps/v1
kind: Deployment
metadata:
  name: craftai-redis
  namespace: craftai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: craftai-redis
  template:
    metadata:
      labels:
        app: craftai-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
