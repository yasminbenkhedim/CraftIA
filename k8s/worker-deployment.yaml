apiVersion: apps/v1
kind: Deployment
metadata:
  name: craftai-worker
  namespace: craftai
  labels:
    app: craftai-worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: craftai-worker
  template:
    metadata:
      labels:
        app: craftai-worker
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: worker
          image: craftai/worker:latest
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
              nvidia.com/gpu: "1"
          envFrom:
            - configMapRef:
                name: craftai-config
            - secretRef:
                name: craftai-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "wget -q -O /dev/null http://localhost:8000/admin/drain || true"]
          volumeMounts:
            - name: artifact-storage
              mountPath: /app/storage/artifacts
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: craftai-artifacts-pvc
