apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: craftai-api-hpa
  namespace: craftai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: craftai-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: craftai-worker-hpa
  namespace: craftai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: craftai-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
