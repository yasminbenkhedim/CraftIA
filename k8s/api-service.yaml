apiVersion: v1
kind: Service
metadata:
  name: craftai-api-service
  namespace: craftai
spec:
  type: ClusterIP
  selector:
    app: craftai-api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: craftai
spec:
  type: ClusterIP
  selector:
    app: craftai-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: craftai
spec:
  type: ClusterIP
  selector:
    app: craftai-redis
  ports:
    - port: 6379
      targetPort: 6379
