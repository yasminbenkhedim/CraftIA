apiVersion: apps/v1
kind: Deployment
metadata:
  name: craftai-api
  namespace: craftai
  labels:
    app: craftai-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: craftai-api
  template:
    metadata:
      labels:
        app: craftai-api
    spec:
      containers:
        - name: api
          image: craftai/api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          envFrom:
            - configMapRef:
                name: craftai-config
            - secretRef:
                name: craftai-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: artifact-storage
              mountPath: /app/storage/artifacts
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: craftai-artifacts-pvc
